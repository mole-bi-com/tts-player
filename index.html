<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS 플레이어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --reader-font-size: 16px; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 16px;
      line-height: 1.8;
      min-height: 100vh;
    }
    #content { font-size: var(--reader-font-size); }

    /* ── 헤더 ── */
    #header {
      background: #13151f;
      border-bottom: 1px solid #2a2d3a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #header h1 { font-size: 16px; color: #aabbff; font-weight: 600; letter-spacing: 0.03em; }
    #engine-toggle {
      margin-left: auto;
      display: flex;
      background: #1e2130;
      border: 1px solid #3a3d4a;
      border-radius: 8px;
      overflow: hidden;
    }
    .engine-btn {
      padding: 6px 14px;
      font-size: 13px;
      border: none;
      background: transparent;
      color: #778899;
      cursor: pointer;
      transition: all 0.2s;
    }
    .engine-btn.active { background: #2a3566; color: #aabbff; }

    /* ── 상태 배너 ── */
    #status-banner {
      display: none;
      background: #1a1d2e;
      border-bottom: 1px solid #2a2d3a;
      padding: 8px 20px;
      font-size: 13px;
      color: #8899cc;
      text-align: center;
    }

    /* ── 입력 영역 ── */
    #input-section {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px 12px;
    }
    #input-section label {
      display: block;
      font-size: 13px;
      color: #6677aa;
      margin-bottom: 8px;
    }
    #text-input {
      width: 100%;
      height: 160px;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #ddeeff;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.7;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #text-input:focus { border-color: #4455aa; }
    #text-input::placeholder { color: #3a4060; }
    #load-btn {
      margin-top: 10px;
      background: #2a3566;
      border: 1px solid #4455aa;
      color: #aabbff;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }
    #load-btn:hover { background: #3344aa; color: white; }

    /* ── 컨트롤 패널 ── */
    #controls {
      position: sticky;
      top: 0;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      z-index: 100;
    }
    .ctrl-btn {
      background: #1e2438;
      border: 1px solid #3a4470;
      color: #99aade;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: #2a3566; color: #ccdaff; }
    .ctrl-btn:disabled { opacity: 0.35; cursor: default; }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #778899;
    }
    .slider-group.disabled { opacity: 0.35; pointer-events: none; }
    input[type=range] { width: 72px; accent-color: #5566cc; }
    #voice-select {
      background: #1e2130;
      border: 1px solid #3a3d4a;
      color: #99aade;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      max-width: 200px;
    }

    /* ── 섹션 네비 ── */
    #section-nav {
      padding: 6px 20px;
      background: #13151f;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #section-nav:empty { display: none; }
    .section-btn {
      background: #1e2130;
      border: 1px solid #3a3d4a;
      color: #7788bb;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .section-btn:hover { background: #2a2d40; color: #aabbee; }

    /* ── 본문 ── */
    #content {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }
    .para-block {
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 6px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .para-block:hover { background: #1a1d2a; border-left-color: #3344aa; }
    .para-block.selected { background: #1e2235; border-left-color: #5566cc; }
    .para-block.playing { background: #162218; border-left-color: #44aa66; }

    .para-h1 { font-size: 1.45em; font-weight: bold; color: #ccdaff; margin-top: 22px; cursor: default; }
    .para-h2 { font-size: 1.2em; font-weight: bold; color: #aabbee; margin-top: 16px; }
    .para-h3 { font-size: 1.05em; font-weight: bold; color: #99aadd; margin-top: 10px; }

    /* ── 진행바 ── */
    #progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: linear-gradient(90deg, #4455cc, #66aaff);
      transition: width 0.3s;
      z-index: 999;
    }

    /* ── 빈 상태 ── */
    #empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #3a4060;
      font-size: 15px;
    }
    #empty-state span { font-size: 40px; display: block; margin-bottom: 14px; opacity: 0.5; }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      #controls { gap: 6px; }
      .ctrl-btn { padding: 5px 10px; font-size: 13px; }
      input[type=range] { width: 56px; }
    }
  </style>
</head>
<body>

<div id="progress-bar" style="width:0%"></div>

<!-- 헤더 -->
<div id="header">
  <h1>🔊 TTS 플레이어</h1>
  <div id="engine-toggle">
    <button class="engine-btn active" id="btn-webspeech" onclick="switchEngine('webspeech')">🌐 Web Speech</button>
    <button class="engine-btn" id="btn-supertonic" onclick="switchEngine('supertonic')">✨ Supertonic</button>
  </div>
</div>

<!-- 상태 배너 -->
<div id="status-banner"></div>

<!-- 텍스트 입력 -->
<div id="input-section">
  <label>텍스트 또는 마크다운을 붙여넣고 로드 버튼을 누르세요</label>
  <textarea id="text-input" placeholder="여기에 텍스트를 붙여넣으세요...&#10;&#10;마크다운 헤딩(# ## ###)도 지원합니다.&#10;빈 줄로 문단을 구분합니다."></textarea>
  <button id="load-btn" onclick="loadText()">▶ 텍스트 로드</button>
</div>

<!-- 컨트롤 패널 -->
<div id="controls" style="display:none">
  <button class="ctrl-btn" onclick="playAll()">▶ 전체 재생</button>
  <button class="ctrl-btn" onclick="playSelected()">↩ 여기서부터</button>
  <button class="ctrl-btn" onclick="pauseResume()">⏸ 일시정지</button>
  <button class="ctrl-btn" onclick="stopAll()">⏹ 정지</button>
  <select id="voice-select" onchange="onVoiceChange()">
    <option value="">— 음성 선택 —</option>
  </select>
  <div class="slider-group" id="sg-rate">
    속도
    <button onclick="changeRate(-0.1)" style="padding:2px 8px;font-size:14px;cursor:pointer">◀</button>
    <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1.0"
      oninput="document.getElementById('rate-val').textContent=parseFloat(this.value).toFixed(1)">
    <button onclick="changeRate(0.1)" style="padding:2px 8px;font-size:14px;cursor:pointer">▶</button>
    <span id="rate-val">1.0</span>
  </div>
  <div class="slider-group" id="sg-pitch">
    음높이 <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1.0"
      oninput="document.getElementById('pitch-val').textContent=parseFloat(this.value).toFixed(1)">
    <span id="pitch-val">1.0</span>
  </div>
  <div class="slider-group">
    음량 <input type="range" id="volume" min="0" max="1" step="0.05" value="1.0"
      oninput="document.getElementById('vol-val').textContent=parseFloat(this.value).toFixed(2)">
    <span id="vol-val">1.00</span>
  </div>
  <div class="slider-group" id="sg-font" title="본문 글자 크기">
    글자
    <button class="ctrl-btn" onclick="changeFontSize(-1)" style="padding:4px 10px">가−</button>
    <span id="font-val">16</span>
    <button class="ctrl-btn" onclick="changeFontSize(1)" style="padding:4px 10px">가＋</button>
  </div>
</div>

<!-- 섹션 네비 -->
<div id="section-nav"></div>

<!-- 본문 -->
<div id="content">
  <div id="empty-state">
    <span>📄</span>
    위 입력창에 텍스트를 붙여넣고 로드하세요
  </div>
</div>

<script type="module">
// ================================================================
//  엔진 상태
// ================================================================
let engine = 'webspeech';   // 'webspeech' | 'supertonic'
let paragraphs = [];
let currentIndex = -1;
let playingIndex = -1;
let isPlaying = false;
let isPaused = false;

// Supertonic 관련
let pipeline = null;
let pipelineLoading = false;
let audioQueue = [];
let audioCtx = null;
let currentSource = null;
let selectedVoice = null; // Web Speech용
let wakeLock = null;
let keepaliveTimer = null;

// ================================================================
//  엔진 전환
// ================================================================
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

window.switchEngine = function(eng) {
  engine = eng;
  stopAll();
  document.getElementById('btn-webspeech').classList.toggle('active', eng === 'webspeech');
  document.getElementById('btn-supertonic').classList.toggle('active', eng === 'supertonic');
  document.getElementById('sg-pitch').classList.toggle('disabled', eng === 'supertonic');
  buildVoiceList();
};

// ================================================================
//  텍스트 로드 & 렌더링
// ================================================================
window.loadText = function() {
  try {
    const raw = document.getElementById('text-input').value.trim();
    if (!raw) return;

    try { stopAll(); } catch(e) {}
    paragraphs = raw.split(/\n\n+/).map(p => p.trim()).filter(p => p.length > 3);
    currentIndex = -1;
    playingIndex = -1;

    renderParagraphs();
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('empty-state')?.remove();
    document.getElementById('input-section').style.marginBottom = '0';
    buildVoiceList();
  } catch(e) {
    setStatus('로드 오류: ' + e.message);
    console.error('loadText error:', e);
  }
};

function renderParagraphs() {
  const content = document.getElementById('content');
  const nav = document.getElementById('section-nav');
  content.innerHTML = '';
  nav.innerHTML = '';

  paragraphs.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'para-block';
    div.id = `p${i}`;

    if (p.startsWith('### ')) {
      div.classList.add('para-h3');
      div.textContent = p.replace(/^### /, '');
    } else if (p.startsWith('## ')) {
      div.classList.add('para-h2');
      div.textContent = p.replace(/^## /, '');
      const btn = document.createElement('button');
      btn.className = 'section-btn';
      btn.textContent = p.replace(/^## /, '').slice(0, 22);
      btn.onclick = () => { selectParagraph(i); div.scrollIntoView({ behavior: 'smooth' }); };
      nav.appendChild(btn);
    } else if (p.startsWith('# ')) {
      div.classList.add('para-h1');
      div.textContent = p.replace(/^# /, '');
    } else {
      div.innerHTML = p
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>');
    }

    div.onclick = () => selectParagraph(i);
    content.appendChild(div);
  });
}

function selectParagraph(i) {
  document.getElementById(`p${currentIndex}`)?.classList.remove('selected');
  currentIndex = i;
  document.getElementById(`p${i}`)?.classList.add('selected');
}

// ================================================================
//  음성 목록 구성
// ================================================================
function buildVoiceList() {
  const sel = document.getElementById('voice-select');
  sel.innerHTML = '';

  if (engine === 'webspeech') {
    const voices = speechSynthesis.getVoices().filter(v =>
      v.lang.startsWith('ko') || v.lang.startsWith('en')
    );
    if (voices.length === 0) {
      sel.innerHTML = '<option value="">음성 로딩 중...</option>';
      speechSynthesis.onvoiceschanged = buildVoiceList;
      return;
    }
    // 품질 점수
    const score = v => {
      let s = 0;
      if (v.lang.startsWith('ko')) s += 10;
      const n = v.name.toLowerCase();
      if (n.includes('neural') || n.includes('natural')) s += 5;
      if (n.includes('sunhi') || n.includes('injoon') || n.includes('heami')) s += 4;
      if (!v.localService) s += 2; // 클라우드
      return s;
    };
    const sorted = voices.sort((a, b) => score(b) - score(a));
    const opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '— 음성 선택 —';
    sel.appendChild(opt0);
    sorted.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      const tag = v.lang.startsWith('ko') ? '🇰🇷 ' : '🇺🇸 ';
      const q = score(v) >= 14 ? ' ⭐' : '';
      const cloud = !v.localService ? ' ☁️' : ' 💻';
      opt.textContent = tag + v.name + cloud + q;
      sel.appendChild(opt);
    });
    // 최고 품질 자동 선택
    if (sorted.length > 0) {
      sel.value = sorted[0].name;
      selectedVoice = sorted[0];
    }
  } else {
    // Supertonic 음성 목록
    const voices = [
      { id: 'F1', label: '여성 1 (F1)' }, { id: 'F2', label: '여성 2 (F2)' },
      { id: 'F3', label: '여성 3 (F3)' }, { id: 'F4', label: '여성 4 (F4)' },
      { id: 'F5', label: '여성 5 (F5)' },
      { id: 'M1', label: '남성 1 (M1)' }, { id: 'M2', label: '남성 2 (M2)' },
      { id: 'M3', label: '남성 3 (M3)' }, { id: 'M4', label: '남성 4 (M4)' },
      { id: 'M5', label: '남성 5 (M5)' },
    ];
    const opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '— 음성 선택 —';
    sel.appendChild(opt0);
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id; opt.textContent = v.id.startsWith('F') ? '👩 ' + v.label : '👨 ' + v.label;
      sel.appendChild(opt);
    });
  }
}

// ── 본문 글자 크기 조절 ──
const FONT_MIN = 12, FONT_MAX = 28, FONT_STEP = 1, FONT_KEY = 'tts.readerFontPx';
function applyFontSize(px) {
  const clamped = Math.min(FONT_MAX, Math.max(FONT_MIN, px));
  document.documentElement.style.setProperty('--reader-font-size', clamped + 'px');
  const label = document.getElementById('font-val');
  if (label) label.textContent = String(clamped);
  try { localStorage.setItem(FONT_KEY, String(clamped)); } catch(e) {}
  return clamped;
}
window.changeFontSize = function(delta) {
  const cur = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--reader-font-size')) || 16;
  applyFontSize(cur + delta * FONT_STEP);
};
(function initFontSize() {
  let saved = 16;
  try { saved = parseInt(localStorage.getItem(FONT_KEY)) || 16; } catch(e) {}
  applyFontSize(saved);
})();

window.changeRate = function(delta) {
  const el = document.getElementById('rate');
  const val = Math.min(2.5, Math.max(0.5, parseFloat(el.value) + delta));
  el.value = val.toFixed(1);
  document.getElementById('rate-val').textContent = val.toFixed(1);
};

window.onVoiceChange = function() {
  const sel = document.getElementById('voice-select');
  if (engine === 'webspeech') {
    selectedVoice = speechSynthesis.getVoices().find(v => v.name === sel.value) || null;
  }
};

// ================================================================
//  재생 컨트롤
// ================================================================
window.playAll = async function() {
  await ensureAudioCtx();
  stopAll();
  acquireWakeLock();
  setupMediaSession();
  if (engine === 'supertonic') {
    await ensureBackgroundAudio();  // 모바일 백그라운드 재생 점유
    startKeepalive();
  } else {
    notifyWebSpeechBgLimit();
  }
  playFrom(0);
};

window.playSelected = async function() {
  await ensureAudioCtx();
  stopAll();
  acquireWakeLock();
  setupMediaSession();
  if (engine === 'supertonic') {
    await ensureBackgroundAudio();
    startKeepalive();
  } else {
    notifyWebSpeechBgLimit();
  }
  playFrom(currentIndex >= 0 ? currentIndex : 0);
};

// Web Speech는 speechSynthesis가 Web Audio 외부에서 돌아 백그라운드 라우팅이 불가.
// 모바일에서 탭을 나가면 브라우저가 강제로 끊음 → 사용자에게 안내.
let bgNoticeShown = false;
function notifyWebSpeechBgLimit() {
  if (bgNoticeShown) return;
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (!mobile) return;
  bgNoticeShown = true;
  setStatus('모바일에서 백그라운드 재생은 Supertonic 엔진에서만 지원됩니다. 계속 듣고 싶다면 ✨ Supertonic으로 전환하세요.');
  setTimeout(() => setStatus(''), 6000);
}

window.stopAll = function() {
  isPlaying = false;
  isPaused = false;
  stopKeepalive();
  releaseWakeLock();
  if (engine === 'webspeech') {
    speechSynthesis.cancel();
  } else {
    stopSupertonic();
  }
  teardownBackgroundAudio();
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.playbackState = 'none';
      navigator.mediaSession.metadata = null;
    } catch(e) {}
  }
  document.querySelectorAll('.para-block.playing').forEach(el => el.classList.remove('playing'));
  document.getElementById('progress-bar').style.width = '0%';
  playingIndex = -1;
};

window.pauseResume = function() {
  if (engine === 'webspeech') {
    if (speechSynthesis.paused) { speechSynthesis.resume(); isPaused = false; }
    else { speechSynthesis.pause(); isPaused = true; }
  } else {
    if (currentSource) {
      // Web Audio pause not straightforward; stop and note position
      stopSupertonic();
      isPaused = true;
    } else if (isPaused) {
      isPaused = false;
      playFrom(playingIndex >= 0 ? playingIndex : 0);
    }
  }
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.playbackState = isPaused ? 'paused' : 'playing'; } catch(e) {}
  }
};

async function playFrom(idx) {
  if (idx >= paragraphs.length) {
    isPlaying = false;
    stopKeepalive();
    releaseWakeLock();
    teardownBackgroundAudio();
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = 'none'; } catch(e) {}
    }
    return;
  }
  isPlaying = true;
  playingIndex = idx;
  updateMediaSession(idx);

  // UI
  document.querySelectorAll('.para-block.playing').forEach(el => el.classList.remove('playing'));
  const el = document.getElementById(`p${idx}`);
  el?.classList.add('playing');
  el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('progress-bar').style.width =
    Math.round((idx / paragraphs.length) * 100) + '%';

  const text = getPlainText(paragraphs[idx]);
  if (!text.trim()) { if (isPlaying) playFrom(idx + 1); return; }

  if (engine === 'webspeech') {
    speakWS(text, () => { if (isPlaying) playFrom(idx + 1); });
  } else {
    try { await speakST(text); } catch(e) { console.error('paragraph error:', e); }
    if (isPlaying) playFrom(idx + 1);
  }
}

function getPlainText(p) {
  return p.replace(/^#{1,3} /, '')
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/\*(.*?)\*/g, '$1')
          .replace(/`(.*?)`/g, '$1');
}

// ================================================================
//  Web Speech API 엔진
// ================================================================
function speakWS(text, onEnd) {
  const sentences = splitSentences(text, 'webspeech');
  let i = 0;
  function next() {
    if (!isPlaying || i >= sentences.length) { if (i >= sentences.length) onEnd?.(); return; }
    const utter = new SpeechSynthesisUtterance(sentences[i++]);
    utter.lang = 'ko-KR';
    utter.rate   = parseFloat(document.getElementById('rate').value);
    utter.pitch  = parseFloat(document.getElementById('pitch').value);
    utter.volume = parseFloat(document.getElementById('volume').value);
    if (selectedVoice) utter.voice = selectedVoice;
    utter.onend = next;
    utter.onerror = next;
    speechSynthesis.speak(utter);
  }
  next();
}

// Supertonic 전용 텍스트 정규화 — 소형 뉴럴 TTS는 서버측 정규화가 없어서
// 마크다운 잔여물/특수기호/연속 부호/종결 부호 부재에서 발음이 뭉개진다.
function normalizeForSupertonic(s) {
  return s
    // 제로폭·BOM·이형 공백 제거
    .replace(/[​-‍﻿ ]/g, ' ')
    // 스마트 따옴표 → 기본 따옴표
    .replace(/[‘’‛]/g, "'")
    .replace(/[“”‟]/g, '"')
    // 말줄임표/연속 마침표 → 단일 마침표 (아티팩트 방지)
    .replace(/[…]+/g, '.')
    .replace(/\.{2,}/g, '.')
    // em/en 대시 → 쉼표 (자연스러운 짧은 휴지)
    .replace(/[—–]/g, ', ')
    // 한 줄에 연속된 같은 종결부호는 하나로 (!!, ??, ?!, !? 등)
    .replace(/([.!?。！？])\1+/g, '$1')
    .replace(/[!?]{2,}/g, m => m[0])
    // 괄호 내부만 남기고 괄호 제거(열·닫 괄호는 음성으로 불필요한 휴지를 만듦)
    .replace(/[\(\)\[\]\{\}<>《》「」『』]/g, ' ')
    // 잔여 마크다운 기호
    .replace(/[#*_`~]/g, ' ')
    // 공백 정규화
    .replace(/[ \t]+/g, ' ')
    .trim()
    // 종결 부호 없으면 마침표 부여 — 꼬리 음 뭉개짐 방지
    .replace(/([^.!?。！？,，:;])$/, '$1.');
}

function splitSentences(text, engine) {
  // 0) 공백 정규화
  const clean = text
    .replace(/\r/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{2,}/g, '\n')
    .trim();

  // 1) 1차 분리: 명확한 문장 종결부만 — 마침표/물음표/느낌표(한·영), 줄바꿈.
  //    "다/요"는 중간 단어(보다, 하다, 되다 등)에서도 공백을 동반하므로
  //    종결 부호 없이 분리하지 않는다. → 문맥 손실로 인한 발음 뭉개짐 방지.
  const primary = clean.split(/(?<=[.!?。！？])\s+|\n+/)
                       .map(s => s.trim())
                       .filter(Boolean);

  // 엔진별 적정 청크 크기:
  //  - Supertonic(소형 뉴럴): 60–140자 구간이 가장 안정. 200자 넘으면 중반부 음소 손실.
  //  - Web Speech(Edge/클라우드): 더 긴 문장도 자연스럽게 처리.
  const isST = engine === 'supertonic';
  const SOFT_MAX = isST ? 140 : 220;
  const MAX      = isST ? 160 : 260;
  const MIN      = isST ? 24  : 20;

  // 2) 2차 분리: SOFT_MAX 초과 문장만 절 경계(쉼표/세미콜론)에서 쪼갠다.
  const split = [];
  for (const s of primary) {
    if (s.length <= SOFT_MAX) { split.push(s); continue; }
    const parts = s.split(/(?<=[,，、;:])\s+/).map(x => x.trim()).filter(Boolean);
    split.push(...parts);
  }

  // 3) 너무 짧은 조각은 앞/뒤와 합친다 — 운율·연음 정보 부족으로 뭉개지는 것 방지.
  const merged = [];
  for (const s of split) {
    const last = merged[merged.length - 1];
    if (last && (last.length < MIN || (last.length + 1 + s.length) <= MAX && s.length < MIN)) {
      merged[merged.length - 1] = last + ' ' + s;
    } else {
      merged.push(s);
    }
  }
  if (merged.length >= 2 && merged[merged.length - 1].length < MIN) {
    merged[merged.length - 2] += ' ' + merged.pop();
  }
  return merged;
}

// ================================================================
//  Supertonic 엔진 (서버 API 경유 — 모바일 OOM 회피)
// ================================================================
const TTS_API = 'https://swoosh77-supertonic-tts-api.hf.space';
let pipelineReady = false;

async function ensurePipeline() {
  if (pipelineReady) return true;
  if (pipelineLoading) {
    await new Promise(r => { const t = setInterval(() => { if (!pipelineLoading) { clearInterval(t); r(); } }, 200); });
    return pipelineReady;
  }
  pipelineLoading = true;
  setStatus('Supertonic 서버 워밍업 중... (첫 요청 시 최대 1분)');
  try {
    // 콜드스타트 대응: warmup 엔드포인트 호출 (타임아웃 90초)
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 90000);
    const res = await fetch(`${TTS_API}/warmup`, { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error(`warmup failed: HTTP ${res.status}`);
    pipelineReady = true;
    setStatus('');
    pipelineLoading = false;
    return true;
  } catch (e) {
    console.error('Supertonic warmup error:', e);
    setStatus(`서버 연결 실패: ${e.message} — Web Speech로 전환하세요`);
    pipelineLoading = false;
    return false;
  }
}

async function fetchTTS(sentence, voice, speed) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(`${TTS_API}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: sentence.trim(), voice, speed }),
      signal: ctrl.signal,
    });
    clearTimeout(t);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const wavBuf = await res.arrayBuffer();
    await ensureAudioCtx();
    return await audioCtx.decodeAudioData(wavBuf);
  } catch(e) {
    clearTimeout(t);
    throw e;
  }
}

async function speakST(text) {
  const ok = await ensurePipeline();
  if (!ok || !isPlaying) return;

  const sentences = splitSentences(text, 'supertonic')
    .map(normalizeForSupertonic)
    .filter(s => /[\p{L}\p{N}]/u.test(s));
  const voice = document.getElementById('voice-select').value || 'F1';

  // Supertonic: 속도 1.5 초과 시 음질 급락 → 내부적으로 클램프하되 UI 알림
  const clampSpeed = () => {
    const raw = parseFloat(document.getElementById('rate').value);
    if (raw > 1.5) {
      setStatus('Supertonic은 1.5배속을 초과하면 발음이 뭉개질 수 있어 1.5로 제한합니다.');
      return 1.5;
    }
    return raw;
  };

  // 첫 문장 미리 fetch
  let nextBufPromise = sentences.length > 0
    ? fetchTTS(sentences[0], voice, clampSpeed()).catch(() => null)
    : null;

  for (let i = 0; i < sentences.length; i++) {
    if (!isPlaying) return;

    const volume = parseFloat(document.getElementById('volume').value);
    const speed  = clampSpeed();

    // 현재 문장 버퍼 대기
    const audioBuf = await nextBufPromise;

    // 다음 문장 즉시 프리페치 시작 (재생과 병렬)
    nextBufPromise = (i + 1 < sentences.length)
      ? fetchTTS(sentences[i + 1], voice, speed).catch(() => null)
      : null;

    if (!isPlaying) return;
    if (!audioBuf) continue; // fetch 실패 시 건너뜀

    try {
      await playDecodedBuffer(audioBuf, volume);
    } catch (e) {
      console.error('Supertonic speak error:', e);
      setStatus(`재생 오류: ${e.message}`);
    }
  }
}

function playDecodedBuffer(audioBuf, volume) {
  return new Promise((resolve) => {
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuf;
    const gain = audioCtx.createGain();
    gain.gain.value = volume;
    src.connect(gain);
    // 백그라운드 재생이 가능하도록 MediaStream으로 라우팅(가능한 경우).
    // <audio> 엘리먼트가 이 스트림을 재생하면서 모바일 브라우저의 오디오 세션을 점유.
    gain.connect(mediaStreamDest || audioCtx.destination);
    currentSource = src;
    src.onended = () => { currentSource = null; resolve(); };
    src.start();
  });
}

// ================================================================
//  백그라운드 재생 (MediaStream + <audio> + MediaSession)
// ================================================================
//  모바일 브라우저는 탭이 숨겨지면 일반 Web Audio 출력을 suspend하지만,
//  <audio> 엘리먼트가 재생 중인 MediaStream은 "media session"으로 인식해
//  백그라운드에서도 재생을 계속 허용한다. 문장 사이 공백에서 스트림이
//  inactive 판정되지 않도록, 감지 불가능할 정도의 작은 무음 하트비트를
//  스트림에 상시 흘려 스트림을 활성 유지한다.
let mediaStreamDest = null;
let bgAudioEl = null;
let heartbeatSrc = null;

async function ensureBackgroundAudio() {
  // 반드시 사용자 제스처(재생 버튼) 안에서 호출돼야 모바일에서 play()가 허용됨.
  await ensureAudioCtx();
  if (bgAudioEl && mediaStreamDest) {
    // 이미 설정됨 — <audio>가 멈춰있으면 다시 재생
    try { if (bgAudioEl.paused) await bgAudioEl.play(); } catch(e) {}
    return;
  }
  if (typeof audioCtx.createMediaStreamDestination !== 'function') return; // 미지원 브라우저

  try {
    mediaStreamDest = audioCtx.createMediaStreamDestination();

    // 하트비트: ~-80dB 무음에 가까운 노이즈를 1초 루프로 항상 흘린다.
    const sr = audioCtx.sampleRate;
    const hb = audioCtx.createBuffer(1, sr, sr);
    const d = hb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() - 0.5) * 0.00008;
    heartbeatSrc = audioCtx.createBufferSource();
    heartbeatSrc.buffer = hb;
    heartbeatSrc.loop = true;
    heartbeatSrc.connect(mediaStreamDest);
    heartbeatSrc.start();

    // 백그라운드 점유용 <audio>. 화면에 보이진 않지만 DOM에 부착돼야 모바일에서 재생됨.
    bgAudioEl = document.createElement('audio');
    bgAudioEl.autoplay = true;
    bgAudioEl.playsInline = true;
    bgAudioEl.setAttribute('playsinline', '');
    bgAudioEl.muted = false;     // muted면 오디오 세션 점유가 안 됨
    bgAudioEl.volume = 1.0;
    bgAudioEl.srcObject = mediaStreamDest.stream;
    bgAudioEl.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;';
    document.body.appendChild(bgAudioEl);
    await bgAudioEl.play();
  } catch(e) {
    console.warn('background audio setup failed:', e);
    try { heartbeatSrc?.stop(); } catch(_) {}
    heartbeatSrc = null;
    mediaStreamDest = null;
    if (bgAudioEl) { try { bgAudioEl.remove(); } catch(_) {} bgAudioEl = null; }
  }
}

function teardownBackgroundAudio() {
  try { heartbeatSrc?.stop(); } catch(_) {}
  heartbeatSrc = null;
  if (bgAudioEl) {
    try { bgAudioEl.pause(); bgAudioEl.srcObject = null; bgAudioEl.remove(); } catch(_) {}
    bgAudioEl = null;
  }
  mediaStreamDest = null;
}

// ── MediaSession (잠금화면/알림 재생 컨트롤) ──
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.setActionHandler('play',  () => { if (isPaused) pauseResume(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!isPaused) pauseResume(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopAll());
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      if (playingIndex > 0) { const i = playingIndex - 1; stopAll(); playFrom(i); }
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      if (playingIndex >= 0 && playingIndex < paragraphs.length - 1) {
        const i = playingIndex + 1; stopAll(); playFrom(i);
      }
    });
  } catch(e) {}
}

function updateMediaSession(idx) {
  if (!('mediaSession' in navigator)) return;
  try {
    const p = paragraphs[idx] || '';
    const snippet = getPlainText(p).replace(/\s+/g, ' ').slice(0, 80) || 'TTS 재생';
    navigator.mediaSession.metadata = new MediaMetadata({
      title: snippet,
      artist: `문단 ${idx + 1} / ${paragraphs.length}`,
      album: engine === 'supertonic' ? 'Supertonic TTS' : 'Web Speech',
    });
    navigator.mediaSession.playbackState = isPaused ? 'paused' : 'playing';
  } catch(e) {}
}

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // 모바일 Chrome은 AudioContext가 suspended 상태로 시작됨 — resume 필요
  if (audioCtx.state === 'suspended') return audioCtx.resume();
  return Promise.resolve();
}

// 긴 추론 중 AudioContext suspend 방지 — 3초마다 1샘플 무음 재생
function startKeepalive() {
  stopKeepalive();
  keepaliveTimer = setInterval(() => {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const s = audioCtx.createBufferSource();
      s.buffer = buf; s.connect(audioCtx.destination); s.start();
    } catch(e) {}
  }, 3000);
}
function stopKeepalive() {
  if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null; }
}

// 화면 꺼짐 방지 (모바일 재생 안정성)
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { console.warn('wake lock failed:', e); }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
}

// 추론 타임아웃 (모바일에서 가끔 무한 대기하는 케이스 대응)
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('inference timeout')), ms))
  ]);
}

async function playAudioBuffer(audioData, sampleRate, volume) {
  await ensureAudioCtx();
  return new Promise((resolve) => {
    const buf = audioCtx.createBuffer(1, audioData.length, sampleRate);
    buf.copyToChannel(audioData instanceof Float32Array ? audioData : new Float32Array(audioData), 0);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = volume;
    src.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    currentSource = src;
    src.onended = () => { currentSource = null; resolve(); };
    src.start();
  });
}

function stopSupertonic() {
  if (currentSource) {
    try { currentSource.stop(); } catch(e) {}
    currentSource = null;
  }
}

function setStatus(msg) {
  const el = document.getElementById('status-banner');
  if (msg) { el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

// ================================================================
//  초기화
// ================================================================
// 모바일 백그라운드 → 포그라운드 복귀 시 재생이 멎는 문제 대응:
//  - Web Speech: speechSynthesis가 "zombie paused"에 빠지면 resume()이 안 먹음.
//  - Web Audio:  AudioContext가 suspend되면서 현재 Source의 onended가 불발,
//                재생 루프가 정지. currentSource는 재개 불가.
//  - WakeLock:   탭 숨김 시 브라우저가 자동 release — 재취득 필요.
// 복귀 후 실제로 정지됐는지 검사하고, 정지됐다면 현재 문단부터 깨끗하게 재시작.
let wasActiveWhenHidden = false;
let interruptedIdx = -1;
let resumeTimer = null;

async function handleVisibilityResume() {
  try { if (audioCtx) await audioCtx.resume(); } catch(e) {}
  // 백그라운드 <audio>가 일시정지됐으면 다시 재생 (모바일에서 세션 복귀 시 필요)
  try { if (bgAudioEl && bgAudioEl.paused) await bgAudioEl.play(); } catch(e) {}
  if (!wasActiveWhenHidden) return;

  // 포그라운드 복귀 직후 짧은 유예를 둬서 자연 재개되는 경우(백그라운드 시간이 짧아
  // 엔진이 계속 이어가는 케이스)에 불필요한 재시작/중복 발화를 피한다.
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    if (!wasActiveWhenHidden) return;
    if (!isPlaying || isPaused) { wasActiveWhenHidden = false; return; }

    let stalled = false;
    if (engine === 'webspeech') {
      // 실제로 말하고 있지도, 대기 중이지도 않으면 좀비 상태.
      stalled = !speechSynthesis.speaking && !speechSynthesis.pending;
      // paused 상태면 먼저 resume 시도, 그래도 speaking 안 되면 stalled로 처리됨.
      if (speechSynthesis.paused) { try { speechSynthesis.resume(); } catch(e) {} }
    } else {
      // Supertonic: currentSource가 없으면 재생 루프가 끊긴 것.
      stalled = !currentSource;
    }
    if (!stalled) { wasActiveWhenHidden = false; return; }

    const idx = interruptedIdx >= 0 ? interruptedIdx : (playingIndex >= 0 ? playingIndex : 0);
    wasActiveWhenHidden = false;

    // 기존 콜백들이 isPlaying=true를 보고 다시 진입하지 못하게 정지 플래그 선 세팅.
    isPlaying = false;
    try { speechSynthesis.cancel(); } catch(e) {}
    stopSupertonic();

    // 엔진 상태가 정리된 뒤 새 재생 시작.
    setTimeout(() => {
      if (engine === 'supertonic') { acquireWakeLock(); startKeepalive(); }
      playFrom(idx);
    }, 120);
  }, 250);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (isPlaying && !isPaused) {
      wasActiveWhenHidden = true;
      interruptedIdx = playingIndex;
    }
    return;
  }
  // visible
  if (isPlaying) acquireWakeLock(); // 숨김 중 자동 해제된 wake lock 재취득
  handleVisibilityResume();
});

// iOS Safari는 BFCache 복귀 시 visibilitychange가 누락되는 경우가 있어 pageshow도 청취.
window.addEventListener('pageshow', () => {
  if (document.visibilityState === 'visible') handleVisibilityResume();
});

// 일부 안드로이드 Chrome에서 visibilitychange가 늦게 오는 경우 focus로 보강.
window.addEventListener('focus', () => {
  if (document.visibilityState === 'visible') handleVisibilityResume();
});

speechSynthesis.onvoiceschanged = () => {
  if (engine === 'webspeech') buildVoiceList();
};
buildVoiceList();
</script>
